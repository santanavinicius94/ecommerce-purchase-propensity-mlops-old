apiVersion: batch/v1
kind: Job
metadata:
  name: purchase-propensity-train
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: ecommerce-purchase-propensity:local
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: training-data
              mountPath: /app/data/raw
              readOnly: true
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: purchase-propensity-data
